; M5stack-zundamon: M5Stack Core2 で 聞き取り → ずんだもんLLM → 画面表示 → 読み上げ
;   pio run -t upload        ファーム（モデルは ../models/ から自動でヘッダ化）
;   ../tools/flash_voice.sh  音声バンク（初回だけ）
[platformio]
default_envs = integration-selected

[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
; 16MBフラッシュ: アプリ4.5MB ＋ 音声バンク領域 zbank 11.4MB（partitions.csv）
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 921600
extra_scripts = pre:gen_headers.py
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DZUNDA_VERSION=\"0.0.3-s2\"
lib_deps =
  m5stack/M5Unified@0.2.26
  m5stack/M5GFX@0.2.33
monitor_speed = 115200
monitor_filters = direct

; 同じソースから従来の逐次prefillを作り、比較できるようにする。
[env:m5stack-core2-reference]
extends = env:m5stack-core2
build_flags =
  ${env:m5stack-core2.build_flags}
  -DZUNDA_FAST_PREFILL=0

[env:integration-arena]
extends = env:m5stack-core2
build_flags =
  ${env:m5stack-core2.build_flags}
  -DTRIAL_SHARED_ARENA=1

[env:integration-memory]
extends = env:integration-arena
build_flags =
  ${env:integration-arena.build_flags}
  -DTRIAL_NO_INTERNAL_PCM=1

[env:integration-psram]
extends = env:integration-memory
build_flags =
  ${env:integration-memory.build_flags}
  -DTRIAL_LLM_PSRAM=1

; 実機比較で採用した組み合わせ。句読点前の早期句切りは含めない。
[env:integration-selected]
extends = env:integration-psram
build_flags =
  ${env:integration-psram.build_flags}
  -DTRIAL_DEFAULT_MASK=1023
